[package]
name = "whurl-core"
version = "0.1.0"
edition = "2024"
description = "Workspace, run, history and config logic shared by whurl's frontends."

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
toml = "0.9"
toml_edit = "0.23"
tempfile = "3.27.0"
