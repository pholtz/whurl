[package]
name = "whurl-gui"
version = "0.1.0"
edition = "2024"
description = "A native window over a whurl workspace, built on Rune."

# Its own workspace, so the whurl CLI never fetches Rune or needs Rune's toolchain.
[workspace]

[dependencies]
whurl-core = { path = "../whurl-core" }
# Rune is pre-release: pin a rev of its `dev` branch and bump it deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695", default-features = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }

# Rune builds against patched copies of these crates, and a dependency's [patch] doesn't reach
# the workspace that depends on it, so repeat Rune's (keep in step with its Cargo.toml).
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }
winit = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "3d4e2dfcecb71890f7f4d6167e82fe6db9dbb695" }

[profile.dev]
debug = "line-tables-only"
# Rune renders and lays out every frame; unoptimised dependencies make the window sluggish.
[profile.dev.package."*"]
opt-level = 2
